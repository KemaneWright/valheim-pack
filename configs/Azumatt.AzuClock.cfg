## Keep the clock on screen so you can't drag it somewhere you can't get it back from
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Clock Clamp To Screen = On

## Hide the clock while the full map is open
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Hide When Map Open = Off

## Hide the clock while the inventory, a store or the game menu is open
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Hide In Menus = Off

## Only show the clock when the time changes?
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Show Clock On Change = Off

## If only showing on change, length in seconds to show the clock before begining to fade
# Setting type: Single
# Default value: 5
Show Clock On Change Fade Time = 5

## How long fade should take in seconds
# Setting type: Single
# Default value: 1
Show Clock On Change Fade Length = 1

## Seconds between clock text rebuilds. Lower is smoother, higher is cheaper
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0.02 to 5
Clock Refresh Interval = 0.25

