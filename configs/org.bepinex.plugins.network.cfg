## Settings file was created by plugin Network v1.1.1
## Plugin GUID: org.bepinex.plugins.network

[1 - General]

## Master switch for every added feature. Off leaves only Steam's send-limit removal and the early ZDOData connection guard active. The connection timeout stays vanilla. Config values are never synced; change them separately on each server, host or client. [Runs on: This installation]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Enable Networking Improvements = On

## Warn when another mod patches the same networking methods. [Runs on: This installation]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Report Patch Conflicts = On

[2 - ZDO Sending]

## Replace vanilla's one-peer-per-frame queue with the adaptive round-robin scheduler. [Runs on: This installation]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Adaptive ZDO Scheduler = On

## Slowest allowed full lap. The default targets 20/s, boosts small servers to 30/s, then tapers between 10 and 15 peers. Actual rate cannot exceed framerate. Lower costs real CPU and upstream. [Runs on: This installation]
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0.01 to 0.2
Send Interval = 0.05

## Emergency brake on how much sending work one frame may do. 0 is no cap and the work is already spread evenly across frames, so leave it there unless you are chasing a stutter. [Runs on: This installation]
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 128
Max Peers Per Frame = 0

## Use the configured batch size instead of vanilla's 10240-byte limit. [Runs on: This installation]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Increase Batch Size = On

## Bytes per ZDO batch (vanilla 10240). Raising this or lowering the send interval costs upstream bandwidth, so watch your host. [Runs on: This installation]
# Setting type: Int32
# Default value: 20480
# Acceptable value range: From 10240 to 262144
Batch Size = 20480

## Use a peer's live character ZDO position when the server chooses nearby objects to send. [Runs on: Server/Host]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Refresh Peer Interest Position = On

[3 - Send Priority]

## Bias players, ships and creatures ahead of scenery within vanilla's existing object and ownership tiers. [Runs on: Server/Host]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Prioritize Players And Creatures = On

[4 - Steam]

## Use the timeout, rate and buffer settings below. Off removes Steam's send limit, uses a 100 MB client buffer and leaves the timeout vanilla. [Runs on: This installation]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Use Improved Steam Settings = On

## Milliseconds before Steam drops an idle connection (vanilla 30000). Applied before each Steam socket opens. [Runs on: This installation]
# Setting type: Single
# Default value: 120000
# Acceptable value range: From 30000 to 600000
Connection Timeout = 120000

## Maximum bytes/sec Steam's bandwidth estimator may use (vanilla 153600). This is permission, not a target. Lower it if you want a hard per-connection ceiling. [Runs on: This installation]
# Setting type: Int32
# Default value: 50000000
# Acceptable value range: From 153600 to 50000000
Send Rate Ceiling = 50000000

## Bytes/sec Steam is allowed to throttle down to. Low is good - it's a floor, not a target. Set it to 50000000 to match the ceiling and get the old pinned behaviour back. [Runs on: This installation]
# Setting type: Int32
# Default value: 153600
# Acceptable value range: From 16384 to 50000000
Send Rate Floor = 153600

## Maximum bytes Steam may hold pending per connection (Steam default 524288). Four MB leaves room for bursts without the 100 MB backlog older Network releases allowed. [Runs on: This installation]
# Setting type: Int32
# Default value: 4194304
# Acceptable value range: From 524288 to 16777216
Send Buffer Size = 4194304

[5 - Map Markers]

## Interpolate other players' map markers instead of letting them sit still for two seconds and jump. [Runs on: This installation]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Smooth Player Markers = On

## Seconds between marker position broadcasts (vanilla player lists update every 2.0). Clients work out their own interpolation delay from what actually arrives. [Runs on: Server/Host]
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0.1 to 2
Position Send Interval = 0.5

## Metres of movement between updates that counts as a teleport, where the marker snaps instead of sliding. [Runs on: Client]
# Setting type: Single
# Default value: 50
# Acceptable value range: From 10 to 500
Teleport Threshold = 50

